name: ChatGPT Delegation Bridge CI

on:
  pull_request:
    paths:
      - "chatgpt-agent-delegation-bridge/**"
      - "docs/ADR-003-chatgpt-primary-delegation-bridge.md"
      - ".github/workflows/chatgpt-delegation-bridge-ci.yml"
  push:
    branches: [main]
    paths:
      - "chatgpt-agent-delegation-bridge/**"
      - "docs/ADR-003-chatgpt-primary-delegation-bridge.md"
      - ".github/workflows/chatgpt-delegation-bridge-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatgpt-agent-delegation-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chatgpt-agent-delegation-bridge/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Architecture boundary
        shell: bash
        run: |
          ! grep -R -E "bullmq|ioredis|chat-page|admin-page|runManagerDecision|manager-agent" src
          ! grep -R -E "<html|<textarea" src
          ! grep -R -E "HermesSpecialist|inspectWithHermes|executeWithHermes|HERMES_ENABLED" src
      - name: Secret scan
        shell: bash
        run: |
          ! grep -R -E "sk-[A-Za-z0-9_-]{16,}|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY" . \
            --exclude-dir=node_modules --exclude-dir=dist --exclude='*.test.ts'

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: chatgpt-agent-delegation-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chatgpt-agent-delegation-bridge/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Parse Windows PowerShell 5.1 scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $allErrors = @()
          Get-ChildItem -LiteralPath '.\scripts\windows' -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            foreach ($error in @($errors)) {
              $allErrors += "$($_.Name):$($error.Extent.StartLineNumber): $($error.Message)"
            }
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $nonAscii = @($bytes | Where-Object { $_ -gt 127 } | Select-Object -First 1)
            if ($nonAscii.Count -gt 0) {
              $allErrors += "$($_.Name): contains non-ASCII bytes"
            }
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | ForEach-Object { Write-Error $_ }
            throw 'PowerShell compatibility gate failed.'
          }
      - name: Run CWC-P3 Windows read-only UAT entrypoint
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\windows\Invoke-BridgeReadOnlyUat.ps1
      - name: Verify CWC-P3 machine-readable receipt
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $receiptPath = '.\runtime\cwc-p3-read-only-uat-latest.json'
          if (-not (Test-Path -LiteralPath $receiptPath)) {
            throw 'CWC-P3 receipt is missing.'
          }
          $receipt = Get-Content -Raw -LiteralPath $receiptPath | ConvertFrom-Json
          if ($receipt.status -ne 'PASS') { throw 'CWC-P3 receipt did not report PASS.' }
          if ($receipt.chatgptPrimaryBrain -ne $true) { throw 'ChatGPT-primary invariant failed.' }
          if ($receipt.backendManagerAgent -ne $false) { throw 'Backend Manager invariant failed.' }
          if ($receipt.separateChatUi -ne $false) { throw 'Separate chat UI invariant failed.' }
          if ($receipt.localWrite -ne $false) { throw 'Local write must remain disabled.' }
          if ($receipt.connectedToChatgpt -ne $false) { throw 'CI must not claim ChatGPT connectivity.' }
          if ($receipt.bridgeLeftRunning -ne $false) { throw 'CI must stop the bridge after UAT.' }
          Write-Host 'CWC_P3_WINDOWS_CI_UAT=PASS'
