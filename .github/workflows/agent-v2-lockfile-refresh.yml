name: Agent Workflow V2 Lockfile Refresh

on:
  push:
    branches:
      - v2/agents-sdk-platform
    paths:
      - agent-workflow-platform-v2/package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/agents-sdk-platform
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global npm@11
      - name: Refresh package lock
        working-directory: agent-workflow-platform-v2
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-workflow-platform-v2/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "build(v2): refresh locked production dependencies"
            git push origin HEAD:v2/agents-sdk-platform
          fi
