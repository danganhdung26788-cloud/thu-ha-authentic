name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: >-
      github.actor == 'danganhdung26788-cloud' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          branch_prefix: "claude/"
          use_commit_signing: true
          additional_permissions: |
            actions: read
          include_comments_by_actor: "danganhdung26788-cloud"
          claude_args: |
            --max-turns 20
            --allowedTools "Bash(npm --prefix chatgpt-agent-delegation-bridge ci --ignore-scripts),Bash(npm --prefix chatgpt-agent-delegation-bridge run check),Bash(npm --prefix chatgpt-agent-delegation-bridge test),Bash(npm --prefix chatgpt-agent-delegation-bridge run build),Bash(git status --short)"
            --append-system-prompt "Read and follow CLAUDE.md. Work only within the issue scope. Do not merge, deploy, alter repository visibility, change credentials, expose secrets, or call another AI. Run the relevant checks and report files changed, tests, risks, and any blocker in the GitHub thread."
