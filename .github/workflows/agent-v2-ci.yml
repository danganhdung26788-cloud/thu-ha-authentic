name: Agent Workflow V2 CI

on:
  pull_request:
    paths:
      - 'agent-workflow-platform-v2/**'
      - '.github/workflows/agent-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_v2_test
          POSTGRES_USER: agent_v2
          POSTGRES_PASSWORD: integration-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_v2 -d agent_v2_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://agent_v2:integration-password@localhost:5432/agent_v2_test
      REDIS_URL: redis://localhost:6379
      QUEUE_NAME: agent-workflow-v2-ci
      RUN_INTEGRATION: '1'
      MINIO_ACCESS_KEY: integration-key
      MINIO_SECRET_KEY: integration-secret-value
      POSTGRES_PASSWORD: compose-validation-password
      API_AUTH_TOKEN: ci-api-auth-token-value
      ADAPTER_AUTH_TOKEN: ci-adapter-auth-token-value
      OPENAI_AGENTS_DISABLE_TRACING: '1'
    defaults:
      run:
        working-directory: agent-workflow-platform-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject whitespace errors
        working-directory: .
        run: git diff --check origin/${{ github.base_ref }}...HEAD

      - name: High-confidence tracked secret scan
        working-directory: .
        run: node agent-workflow-platform-v2/scripts/secret-scan.mjs

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent-workflow-platform-v2/package-lock.json

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run check

      - name: Apply migrations
        run: npm run migrate

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate Compose topology
        run: docker compose -f compose.yml config --quiet

      - name: Build runtime image
        run: docker build -t agent-workflow-platform-v2:ci .

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  windows-host-runtime:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        working-directory: agent-workflow-platform-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse every PowerShell script
        shell: pwsh
        working-directory: .
        run: |
          $errors = @()
          Get-ChildItem agent-workflow-platform-v2/scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $errors += $parseErrors | ForEach-Object {
                '{0}:{1} {2}' -f $_.Extent.File, $_.Extent.StartLineNumber, $_.Message
              }
            }
          }
          if ($errors.Count -gt 0) { throw ($errors -join "`n") }

      - name: Reject Windows PowerShell 5.1-incompatible patterns
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\windows\Test-PowerShell51Compatibility.ps1' -ProjectRoot $PWD.Path
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 compatibility scan failed.' }

      - name: Bootstrap configuration with Windows PowerShell 5.1
        shell: powershell
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP 'agent-v2-ps51-workspace'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\windows\New-AgentV2Configuration.ps1' -ProjectRoot $PWD.Path -WorkspaceRoot $workspace
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 configuration bootstrap failed.' }
          foreach ($path in @('.env', 'runtime\workspaces.json', 'runtime\host-adapter.hermes.env', 'runtime\host-adapter.codex.env')) {
            if (-not (Test-Path $path)) { throw "Bootstrap output missing: $path" }
          }
          if ((Get-Content .env | Where-Object { $_ -match '^GOOGLE_API_KEY=.+$' }).Count -gt 0) {
            throw 'Gemini API key must remain empty in generated configuration.'
          }

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent-workflow-platform-v2/package-lock.json

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Type check on Windows
        run: npm run check

      - name: Host adapter unit tests on Windows
        run: node --import tsx --test test/host-adapter.test.ts test/host-adapter-server.test.ts

      - name: Build Windows host runtime
        run: npm run build
