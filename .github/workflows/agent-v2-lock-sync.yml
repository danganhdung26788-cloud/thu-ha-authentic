name: Agent V2 Lockfile Sync

on:
  push:
    branches:
      - v2/agents-sdk-platform
    paths:
      - agent-workflow-platform-v2/package.json
      - .github/workflows/agent-v2-lock-sync.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent-workflow-platform-v2
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2/agents-sdk-platform
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile when changed
        working-directory: .
        run: |
          if git diff --quiet -- agent-workflow-platform-v2/package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-workflow-platform-v2/package-lock.json
          git commit -m "chore(v2): synchronize package lock for Google GenAI SDK"
          git push origin HEAD:v2/agents-sdk-platform
