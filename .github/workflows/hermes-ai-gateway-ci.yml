name: Hermes AI Gateway CI

on:
  pull_request:
    paths:
      - 'integrations/ai-gateway/**'
      - '.github/workflows/hermes-ai-gateway-ci.yml'
      - '.gitignore'
  push:
    branches: [main]
    paths:
      - 'integrations/ai-gateway/**'
      - '.github/workflows/hermes-ai-gateway-ci.yml'
      - '.gitignore'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/ai-gateway
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify secrets are not tracked
        working-directory: .
        run: |
          test ! -f integrations/ai-gateway/.env
          ! git ls-files | grep -E '(^|/)service-account.*\.json$'
          ! git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '/\.env\.example$'
      - name: Install reproducibly or generate initial lockfile
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi
      - name: Commit generated dependency lock on same-repository PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- integrations/ai-gateway/package-lock.json && git ls-files --error-unmatch integrations/ai-gateway/package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json already committed and unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrations/ai-gateway/package-lock.json
          git commit -m 'chore(ai-gateway): lock production dependencies'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
