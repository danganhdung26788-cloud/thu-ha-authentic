name: Agent V2 Lockfile Bootstrap

on:
  push:
    branches:
      - v2/agents-sdk-platform
    paths:
      - 'agent-workflow-platform-v2/package.json'
      - '.github/workflows/agent-v2-lockfile.yml'

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
        with:
          ref: v2/agents-sdk-platform

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Generate lockfile
        working-directory: agent-workflow-platform-v2
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-workflow-platform-v2/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "build(v2): commit reproducible npm lockfile"
          git push origin HEAD:v2/agents-sdk-platform
