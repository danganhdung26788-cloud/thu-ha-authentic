name: Hermes Direct Integration

on:
  pull_request:
    paths:
      - 'integrations/hermes/**'
      - '.github/workflows/hermes-integration.yml'
  push:
    branches:
      - main
    paths:
      - 'integrations/hermes/**'
      - '.github/workflows/hermes-integration.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      META_DEDUPE_DB: /tmp/tha-meta-dedupe.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/hermes/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r integrations/hermes/requirements.txt
      - name: Compile
        run: python -m compileall integrations/hermes
      - name: Background task contract
        run: python -m unittest -v integrations.hermes.tests.test_background_task_contract
      - name: Fanpage draft processor
        run: python -m unittest -v integrations.hermes.tests.test_fanpage_draft_processor
      - name: Fanpage runner contract
        run: python -m unittest -v integrations.hermes.tests.test_fanpage_runner_contract
      - name: Installer contract
        run: python -m unittest -v integrations.hermes.tests.test_installer_contract
      - name: Core integration tests
        run: python -m unittest -v integrations.hermes.tests.test_integration
      - name: Production hardening contract
        run: python -m unittest -v integrations.hermes.tests.test_production_hardening_contract
      - name: Full discovery regression
        run: python -m unittest discover -v -s integrations/hermes/tests -t . -p 'test_*.py'
