name: Agent V2 Runtime Lockfile Sync

on:
  push:
    branches:
      - v2/runtime-activation
    paths:
      - agent-workflow-platform-v2/package.json
      - .github/workflows/agent-v2-runtime-lock-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent-workflow-platform-v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/runtime-activation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global npm@11
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        working-directory: .
        run: |
          if git diff --quiet -- agent-workflow-platform-v2/package-lock.json; then
            echo "package-lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-workflow-platform-v2/package-lock.json
          git commit -m "chore(v2): lock Codex SDK runtime dependency"
          git push origin HEAD:v2/runtime-activation
