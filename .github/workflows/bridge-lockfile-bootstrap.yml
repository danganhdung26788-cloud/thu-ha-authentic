name: Bootstrap Delegation Bridge Lockfile

on:
  push:
    branches:
      - rebuild/chatgpt-mcp-agents-orchestrator
    paths:
      - "chatgpt-agent-delegation-bridge/package.json"
      - ".github/workflows/bridge-lockfile-bootstrap.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/chatgpt-mcp-agents-orchestrator
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate exact package lock
        working-directory: chatgpt-agent-delegation-bridge
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit package lock when changed
        shell: bash
        run: |
          if git diff --quiet -- chatgpt-agent-delegation-bridge/package-lock.json && git ls-files --error-unmatch chatgpt-agent-delegation-bridge/package-lock.json >/dev/null 2>&1; then
            echo "Package lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-agent-delegation-bridge/package-lock.json
          git commit -m "build(bridge): lock dependency graph"
          git push origin HEAD:rebuild/chatgpt-mcp-agents-orchestrator
